[project]
name = "norax"
version = "0.11.0"
description = "A self-hosted AI agent runtime with durable memory, verified tool use, and multi-model routing."
requires-python = ">=3.12"
authors = [{ name = "Colby Caron" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["ai-agent", "self-hosted", "llm", "agentic-ai", "memory", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "numpy>=2.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx[http2]>=0.27",
  "jsonschema>=4.23",
  "pydantic>=2.9",
  "structlog>=24.4",
  "python-ulid>=3.1",
  "anyio>=4.6",
  "typer>=0.13",
  "prometheus-client>=0.21",
  "playwright>=1.58.0",
  "trafilatura>=2.0",
  "websocket-client>=1.9",
  "opencv-python-headless>=5.0",
  "pytesseract>=0.3.13",
  "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "mypy>=1.13",
  "respx>=0.21",
  "pip-audit>=2.9",
]
heavy = [
  "discord.py>=2.4",
]
production = [
  "discord.py>=2.4",
  "uvicorn[standard]>=0.32",
  "prometheus-client>=0.21",
]
mcp = [
  "mcp>=1.29,<2",
]
a2a = [
  "uvicorn[standard]>=0.32",
]
commerce = [
  "fastapi>=0.115",
  "web3>=7.0",
]

[tool.coverage.run]
source = ["norax"]
branch = true

[tool.coverage.report]
# Never let integer display rounding turn a sub-threshold run green.
fail_under = 64.5
precision = 2
show_missing = true

[project.urls]
Homepage = "https://github.com/clarboncy/norax"
Repository = "https://github.com/clarboncy/norax"
Issues = "https://github.com/clarboncy/norax/issues"

[project.scripts]
norax = "norax.__main__:main"
norax-sleep = "norax.sleep:main"
norax-node = "norax.remote.node:main"
norax-remote-relay = "norax.remote.relay:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["norax"]

[tool.hatch.build.targets.wheel.force-include]
"config/runtime.jsonc" = "norax/defaults/runtime.jsonc"
"soul" = "norax/defaults/soul"
"tools/computer_use.py" = "norax/_tools/computer_use.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = [
  "E501",    # long lines are acceptable in prompts/schema fixtures
  "E701",    # compact one-liner if/for bodies are intentional in handlers
  "E702",    # compact semicolon statements in commerce handlers
  "B008",    # Depends() in default args is the canonical FastAPI DI pattern
  "ASYNC109", # timeout params are a deliberate API surface, not asyncio.timeout
  "ASYNC220", # controlled restart path intentionally detaches subprocess
  "ASYNC230", "ASYNC240", "ASYNC251", # local file/tool IO is intentionally sync inside tool boundary
]

[tool.mypy]
python_version = "3.12"
strict = false
files = ["norax", "agent_os", "tools"]
exclude = ["dist/", "build/", ".venv/", "training/unsloth_compiled_cache/"]
ignore_missing_imports = true
check_untyped_defs = true
